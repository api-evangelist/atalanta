aid: atalanta
name: Atalanta
description: >-
  Atalanta is a mathematical AI company building provably correct decision-making
  for the world's most important missions. Its flagship platform, Argo, is described
  as the first software understanding platform - it uses mathematical proof and formal
  verification to establish safety, security, and performance guarantees for software-defined
  and autonomous systems at operational speed, moving beyond the limits of traditional
  testing. Argo identifies failure modes before deployment and verifies compliance
  with critical constraints across energy (nuclear and grid control systems), space
  (satellite and communications networks), and defense (complex military systems and
  data isolation). Atalanta was founded by Anjana Rajan and Jonathan Ring, is headquartered
  in Washington, D.C., and is backed by Felicis and In-Q-Tel.
